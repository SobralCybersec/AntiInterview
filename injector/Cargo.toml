[package]
name = "anti-interview"
version = "1.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5.15"
eframe = { version = "0.33.0", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui_extras = { version = "0.33.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["ico", "gif", "png", "jpeg"]}
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6.0"
open = "5"
wry = "0.55.1"
tao = "0.30"
arboard = "3"

# Windows-only: DLL injection, Win32 APIs, Graphics.Capture, and the tray
# (tray-icon pulls GTK3 + libxdo on Linux; the Linux build stubs the tray).
[target.'cfg(windows)'.dependencies]
tray-icon = "0.18"
dll-syringe = { version = "0.18.2", features = ["into-x86-from-x64", "rpc-raw"] }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging" , "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp"] }
windows-capture = "2.0.0"

# Linux-only: JSON for `hyprctl clients -j`, plus winit's Wayland/X11 backends
# (base eframe features union with these on Linux).
[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1"
eframe = { version = "0.33.0", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.23"

[[bin]]
name = "anti-interview"
path = "src/main.rs"

[[bin]]
name = "ai_browser_window"
path = "src/bin/ai_browser_window.rs"

[[bin]]
name = "test_wry_browser"
path = "src/bin/test_wry_browser.rs"
